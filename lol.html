<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Autoplay YouTube Video</title>
</head>
<body>
	<iframe
		width="560"
		height="315"
		src="https://www.youtube.com/embed/QOhmcbfwxnA?autoplay=1&mute=1&playsinline=1"
		title="YouTube video"
		allow="autoplay; encrypted-media"
		allowfullscreen>
	</iframe>
</body>
</html>
