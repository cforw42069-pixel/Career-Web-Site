<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Flashbang</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
		}

		video {
			display: block;
			width: 100vw;
			height: 100vh;
			object-fit: cover;
		}
	</style>
</head>
<body>
	<video id="bgVideo" autoplay playsinline loop controls>
		<source src="flashbang.mp4" type="video/mp4">
	</video>

	<script>
		const video = document.getElementById('bgVideo');

		const enableAudio = () => {
			video.muted = false;
			video.volume = 100;
			video.play().catch(() => {});
		};

		document.addEventListener('click', enableAudio, { once: true });
		document.addEventListener('touchstart', enableAudio, { once: true });
	</script>
</body>
</html>
